<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar-header">
    <span class="sidebar-logo">🎓</span>
    <div>
      <h3>ISA-TWAOOS</h3>
      <small>Academic Portal USV</small>
    </div>
  </div>

  <!-- Nav principal -->
  <nav class="sidebar-nav">
    <ng-container *ngFor="let item of navItems"> 
    <a
      *ngIf="!item['adminOnly'] || userRole === 'admin'"
      class="nav-item"
      [routerLink]="item.route"
      routerLinkActive="active"
    >
      <span class="nav-icon">{{ item.icon }}</span>
      <span>{{ item.label }}</span>
    </a></ng-container>

    <!-- Buton Create Event -->
   <button *ngIf="userRole === 'organizer' || userRole === 'admin'" class="btn-create" routerLink="/events/create">
    <span>+</span> Creează eveniment
  </button>

  </nav>

  <!-- Footer nav -->
  <div class="sidebar-footer">
    
    <a
      *ngFor="let item of footerItems"
      class="nav-item"
      [routerLink]="item.route"
      routerLinkActive="active"
    >
      <span class="nav-icon">{{ item.icon }}</span>
      <span>{{ item.label }}</span>
    </a>

  </div>

</aside>
